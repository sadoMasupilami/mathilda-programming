<style>
  .r-pass .kopf { display: flex; align-items: center; gap: 4mm; border-bottom: 1.2mm solid var(--akzent); padding-bottom: 2.5mm; margin-bottom: 3mm; }
  .r-pass .kopf h1 { font-family: var(--text); font-weight: 1000; font-size: 26pt; margin: 0; flex: 1; }
  .r-pass .kopf .name { font-family: var(--kind); font-size: 15pt; }
  .r-pass .erkl { font-family: var(--kind); font-size: 14pt; margin: 0 0 2.5mm 0; line-height: 1.3; }
  .r-pass .gitter { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 2.2mm; flex: 1 1 0; min-height: 0; }
  .r-pass .f {
    border: 0.6mm solid var(--akzent);
    border-radius: 3.5mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 1.6mm 2mm 1.6mm 2mm;
    position: relative;
    break-inside: avoid;
  }
  /* Titel in der Kinderschrift, groß genug zum Selberlesen; Nummer unten links neben den Sternen */
  .r-pass .f .t { hyphens: manual; font-family: var(--kind); font-weight: 700; font-size: 13pt; line-height: 1.05; text-align: center; width: 100%; height: 9.6mm; display: flex; align-items: center; justify-content: center; }
  .r-pass .f .stempel { width: 17mm; height: 17mm; border-radius: 50%; border: 0.5mm dashed var(--grau); }
  .r-pass .f .unten { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .r-pass .f .nr { flex: none; width: 7mm; height: 7mm; border-radius: 50%; background: var(--akzent); color: white; display: flex; align-items: center; justify-content: center; font-family: var(--text); font-weight: 1000; font-size: 11pt; }
  .r-pass .f .sterne { display: flex; gap: 0.5mm; line-height: 0; }
  .r-pass .f .urk { position: absolute; top: 50%; right: 2mm; transform: translateY(-50%); line-height: 0; }
  .r-pass .legende { display: flex; flex-wrap: nowrap; gap: 3.5mm; justify-content: center; font-family: var(--text); font-size: 8pt; color: var(--grau); margin-top: 2.5mm; white-space: nowrap; }
  .r-pass .legende span { display: inline-flex; align-items: center; gap: 1.2mm; }
  .r-pass .legende i { display: inline-block; width: 3.5mm; height: 3.5mm; border-radius: 1mm; }
</style>

<section class="seite r-pass" id="sammelpass" data-toc="Mein Sammelpass" data-block="A">
  <div class="kopf">
    <m-bild name="krone" gr="13"></m-bild>
    <h1>Mein Sammelpass</h1>
    <span class="name">von {{KIND}}</span>
  </div>
  <p class="erkl">Nach jeder Einheit: Stempel oder Sticker in den Kreis.<br>Mal die Sterne an: Wie hat es dir gefallen?</p>
  <div class="gitter" id="r-pass-gitter"></div>
  <div class="legende">
    <span><i style="background: var(--block-a)"></i>Befehle, Programme, Fehler</span>
    <span><i style="background: var(--block-b)"></i>Muster und Geheimcodes</span>
    <span><i style="background: var(--block-c)"></i>Wenn-dann und Logik</span>
    <span><i style="background: var(--block-d)"></i>Strategie und Projekte</span>
    <span><m-bild name="medaille" gr="4.5"></m-bild>Urkunde!</span>
  </div>
  <div class="fuss"><span>{{KIND}}s Denk-Werkstatt</span><span class="seitenzahl" data-ref="sammelpass"></span><span>Sammelpass</span></div>
</section>

<script>
  // Felder des Sammelpasses (Titel laut plan/lehrplan.md; können sich nach der Rückmeldung ändern).
  // Blöcke wie in src/components.js: 1–5 A, 6–10 B, 11–14 C, ab 15 D. „|“ = Zeilenumbruch im Feld.
  (function () {
    const einheiten = [
      'Ich bin dein|Roboter', 'Drachen-Pfade', 'Erst das,|dann das', 'Der|Fehler-Kobold', 'Der Wiederhol-|Zauber',
      'Muster-Detektivin', 'Geheimschrift der Feen', 'Bilder aus Kästchen', 'Nur Ja oder Nein', 'Sortieren und Suchen',
      'Wenn-dann-Regeln', 'Logikrätsel', 'Ja-Nein-Bäume', 'Formen-Quadrate',
      'Gewinnen|mit Plan', 'Labyrinth-|Meisterin', 'Zaubersprüche', 'Ich erfinde|ein Spiel', 'Großer Roboter-|Parcours', 'Das große|Code-Fest',
    ];
    const block = (n) => (n <= 5 ? 'A' : n <= 10 ? 'B' : n <= 14 ? 'C' : 'D');
    const g = document.getElementById('r-pass-gitter');
    g.innerHTML = einheiten.map((t, i) => {
      const n = i + 1;
      return '<div class="f" data-block="' + block(n) + '"><div class="t"><span>' + t.split('|').join('<br>') + '</span></div>' +
        (n === 10 || n === 20 ? '<span class="urk"><m-bild name="medaille" gr="7"></m-bild></span>' : '') +
        '<div class="stempel"></div><div class="unten"><span class="nr">' + n + '</span><div class="sterne"><m-stern gr="8"></m-stern><m-stern gr="8"></m-stern><m-stern gr="8"></m-stern></div></div></div>';
    }).join('');
  })();
</script>
