# Web-App auf GitHub Pages veröffentlichen (nur web/ samt Rätsel-Daten, keine PDFs).
# Einmalig vorher: Settings → Pages → Source „GitHub Actions“.
name: Web-App auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Nur Node-Bordmittel: kein npm install nötig. Prüft alle Rätsel, Zeichen und Adressen.
      - name: Web-App bauen
        run: node werkzeuge/web-bauen.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
